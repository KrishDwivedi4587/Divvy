name: divvy
description: "Split a restaurant bill fairly. Photograph a receipt, add the people, and see exactly what each person owes, to the paisa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State management and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3

  # Receipt capture and recognition
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1

  # Local persistence and files
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  path: ^1.9.1

  # Formatting and identifiers
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Runs real SQLite on the desktop VM so the repositories can be tested
  # on a development machine without a phone or emulator.
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
