<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:600px;height:800px;overflow:hidden}
  body{background:radial-gradient(ellipse at 40% 35%,#3a3f4a 0%,#23262d 55%,#16181d 100%);display:flex;align-items:center;justify-content:center}
  .paper{width:330px;padding:30px 26px 34px;background:#FBFAF6;color:#24262b;
    font-family:'Courier New',Consolas,monospace;font-size:14.5px;line-height:1.45;
    transform:rotate(-2.2deg);box-shadow:0 22px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);
    position:relative}
  .c{text-align:center}.b{font-weight:bold}
  .name{font-size:21px;letter-spacing:2px;font-weight:bold}
  .r{display:flex;justify-content:space-between}
  .hr{border-top:1.5px dashed #6d6f75;margin:9px 0}
  .tot{font-size:17px;font-weight:bold}
  .dim{color:#55585f;font-size:13px}
</style></head><body>
<div class="paper">
  <div class="c name">THE SPICE TABLE</div>
  <div class="c dim">12 Riverfront Road, Ahmedabad</div>
  <div class="c dim">GSTIN 24ABCDE1234F1Z5</div>
  <div class="hr"></div>
  <div class="r dim"><span>Bill No: 0482</span><span>Table: 7</span></div>
  <div class="r dim"><span>Date: 14/11/2026</span><span>21:14</span></div>
  <div class="hr"></div>
  <div class="r b"><span>ITEM</span><span>AMOUNT</span></div>
  <div class="r"><span>1 x Paneer Tikka</span><span>340.00</span></div>
  <div class="r"><span>1 x Dal Makhani</span><span>280.00</span></div>
  <div class="r"><span>1 x Cold Coffee</span><span>150.00</span></div>
  <div class="r"><span>4 x Butter Naan</span><span>160.00</span></div>
  <div class="hr"></div>
  <div class="r"><span>Sub Total</span><span>930.00</span></div>
  <div class="r"><span>Service Chg 5%</span><span>46.50</span></div>
  <div class="r"><span>GST 5%</span><span>48.83</span></div>
  <div class="hr"></div>
  <div class="r tot"><span>TOTAL</span><span>Rs 1025.33</span></div>
  <div class="hr"></div>
  <div class="c dim">Thank you. Visit again!</div>
</div>
</body></html>
